services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: edu_agent
      POSTGRES_USER: edu_agent
      POSTGRES_PASSWORD: edu_agent_local
    ports:
      - "5432:5432"
    volumes:
      - edu_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu_agent -d edu_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - DATABASE_URL=postgresql://edu_agent:edu_agent_local@postgres:5432/edu_agent
      - PYTHONPATH=/app
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://edu_agent:edu_agent_local@postgres:5432/edu_agent
      - EDU_AGENT_DEPLOYED_COMMIT=${EDU_AGENT_DEPLOYED_COMMIT:-local-compose}
      - EDU_AGENT_ENVIRONMENT=${EDU_AGENT_ENVIRONMENT:-local}
    volumes:
      - ./.chroma:/app/.chroma
      - ${EMBED_MODEL_PATH:-/dev/null}:${EMBED_MODEL_PATH:-/dev/null}:ro
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  edu_agent_postgres:
