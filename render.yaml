# Render Blueprint — AutoTutor 后端（Docker）
# 用法：Render Dashboard → New → Blueprint → 指向本仓库，自动读取此文件。
# 部署后把后端公网 URL 填到 Vercel 的 NEXT_PUBLIC_API_BASE_URL。
#
# 注：会话/限流当前用进程内存兜底（TTL 1h），demo 无需独立 Redis；
#     如需跨实例持久化，再单独接 Render Key Value 并改造 session_store。
services:
  - type: web
    name: edu-agent-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    # Demo environment: every successful push to the linked main branch deploys automatically.
    autoDeploy: true
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: PYTHONUNBUFFERED
        value: "1"
      # Free Web Service 不提供独立 pre-deploy command。容器启动入口会在
      # advisory lock 下执行 Alembic，并在迁移/校验失败时拒绝启动 API。
      - key: EDU_AGENT_AUTO_MIGRATE
        value: "true"
      - key: EDU_AGENT_REQUIRE_DIRECT_MIGRATION_URL
        value: "true"
      - key: EDU_AGENT_ENVIRONMENT
        value: production
      - key: EDU_AGENT_REQUIRE_LLM_EVIDENCE_V2
        value: "false"
      - key: EDU_AGENT_AUTH_REQUIRED
        value: "true"
      - key: EDU_AGENT_RUNTIME_V2_CONFIG_VERSION
        value: v1.41-history-control
      - key: EDU_AGENT_RUNTIME_ROLLOUT_AGENT_TYPE
        value: history_character
      - key: EDU_AGENT_RUNTIME_V2_ENABLED
        value: "false"
      - key: EDU_AGENT_RUNTIME_V2_SHADOW_MODE
        value: "true"
      - key: EDU_AGENT_RUNTIME_V2_ACTIVE_ENABLED
        value: "false"
      - key: EDU_AGENT_RUNTIME_V2_PERCENT_BPS
        value: "0"
      - key: EDU_AGENT_RUNTIME_V2_HISTORY_CHARACTER_BPS
        value: "0"
      - key: EDU_AGENT_RUNTIME_V2_LEARNING_ASSISTANT_BPS
        value: "0"
      - key: EDU_AGENT_RUNTIME_V2_AUTOTUTOR_BPS
        value: "0"
      - key: EDU_AGENT_RUNTIME_V2_ESSAY_GRADER_BPS
        value: "0"
      - key: EDU_AGENT_RUNTIME_V2_DEBATE_BPS
        value: "0"
      - key: EDU_AGENT_RUNTIME_V2_KILL_SWITCH
        value: "false"
      # AutoTutor Graph executor is independently governed. Blueprint defaults
      # are deliberately Legacy/BPS 0; a Canary requires a separate manual
      # production approval and never follows from an ordinary deploy.
      - key: EDU_AGENT_AUTOTUTOR_EXECUTOR_MODE
        value: legacy
      - key: EDU_AGENT_AUTOTUTOR_GRAPH_ACTIVE_BPS
        value: "0"
      - key: EDU_AGENT_AUTOTUTOR_GRAPH_CONFIG_VERSION
        value: v1.49.8-attestation-binding
      - key: EDU_AGENT_AUTOTUTOR_GRAPH_BUCKET_SALT
        sync: false
      - key: EDU_AGENT_AUTOTUTOR_GRAPH_KILL_SWITCH
        value: "false"
      - key: EDU_AGENT_AUTOTUTOR_GRAPH_COMPARATOR_ENABLED
        value: "true"
      - key: EDU_AGENT_AUTOTUTOR_GRAPH_FALLBACK_ENABLED
        value: "true"
      # AutoTutor production verification uses a least-privilege machine token.
      # GitHub owns the raw token; Render stores only SHA-256 digests.
      - key: EDU_AGENT_AUTOTUTOR_VERIFICATION_MACHINE_REQUIRED
        value: "true"
      - key: EDU_AGENT_AUTOTUTOR_VERIFICATION_TOKEN_SHA256
        sync: false
      - key: EDU_AGENT_AUTOTUTOR_VERIFICATION_TOKEN_KEY_ID
        value: current
      - key: EDU_AGENT_AUTOTUTOR_VERIFICATION_NEXT_TOKEN_SHA256
        sync: false
      - key: EDU_AGENT_AUTOTUTOR_VERIFICATION_NEXT_TOKEN_KEY_ID
        sync: false
      - key: EDU_AGENT_AUTOTUTOR_VERIFICATION_BOOTSTRAP_SHA256
        sync: false
      - key: EDU_AGENT_RUNTIME_V2_PERSIST_EVENTS
        value: "true"
      - key: EDU_AGENT_RUNTIME_V2_ARTIFACT_ENABLED
        value: "false"
      - key: EDU_AGENT_RUNTIME_V2_CHECKPOINT_ENABLED
        value: "false"
      - key: EDU_AGENT_RUNTIME_V2_RESUMABLE_ENABLED
        value: "false"
      - key: EDU_AGENT_RUNTIME_V2_DYNAMIC_REPLAN_ENABLED
        value: "false"
      - key: EDU_AGENT_RUNTIME_V2_READ_FANOUT_ENABLED
        value: "false"
      - key: EDU_AGENT_RUNTIME_ROLLOUT_MIN_TERMINAL_RUNS
        value: "100"
      # 线上前端域名（Vercel 自定义域名时回填；*.vercel.app 已由后端正则放行）
      - key: FRONTEND_ORIGIN
        sync: false
      # 生产认证签名密钥，必须在 Render 面板设置为随机高强度值。
      - key: JWT_SECRET
        sync: false
      # Supabase / Postgres 连接串
      - key: DATABASE_URL
        sync: false
      # Alembic/advisory lock 必须走 Supabase direct/session connection，不能走 transaction pooler。
      - key: DIRECT_URL
        sync: false
      # LLM 凭证 —— 在 Render 面板填写，勿入库。线上聊天走百炼公网。
      - key: LLM_PROVIDER
        value: bailian
      - key: BAILIAN_API_KEY
        sync: false
      - key: BAILIAN_BASE_URL
        sync: false
      # RAG 向量检索：embedding 走 OpenAI-compatible 托管 API（如 Jina），
      # 向量库走 DATABASE_URL 指向的 Postgres + pgvector。离线用
      # scripts/build_pgvector_index.py 建索引后即生效；未建索引/未配 key 时检索返回空。
      - key: EMBED_API_BASE
        value: https://api.jina.ai/v1
      - key: EMBED_API_KEY
        sync: false
      - key: EMBED_MODEL
        value: jina-embeddings-v3
      - key: EMBED_TASK
        value: text-matching
      - key: EMBED_DIM
        value: "1024"
      # 模型名留空走代码内置默认（bailian: deepseek-v4-flash / qwen3.7-plus / qwen3.6-35b-a3b），
      # 与本地一致，无需在面板填写。如要覆盖再设 LLM_MODEL_FAST/QUALITY/FALLBACK。
      # 生产 RAG 不依赖本地 EMBED_MODEL_PATH：embedding 走 EMBED_API_BASE/EMBED_API_KEY，
      # 向量库走 DATABASE_URL + pgvector。部署后用 /api/debug/rag/health 或
      # production_rag_health_smoke 验证 embedding API、pgvector、rag_documents 索引是否完整。
