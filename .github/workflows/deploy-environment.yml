name: Deploy Immutable Backend Environment

on:
  workflow_dispatch:
    inputs:
      target_environment:
        required: true
        type: choice
        options: [staging, production]
      commit:
        required: true
        type: string
      image_digest:
        required: true
        type: string
      ready_url:
        required: true
        type: string
      runtime_config_version:
        required: true
        type: string
      promotion_percent:
        required: true
        default: '1'
        type: choice
        options: ['1', '10']
      evidence_run_id:
        description: Required for production; staging or 48h production evidence workflow run
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: immutable-deploy-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - name: Validate immutable selectors
        env:
          COMMIT: ${{ inputs.commit }}
          DIGEST: ${{ inputs.image_digest }}
          TARGET: ${{ inputs.target_environment }}
          PERCENT: ${{ inputs.promotion_percent }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT"
          if [ "$TARGET" = staging ]; then test "$PERCENT" = 1; fi
      - name: Download promotion evidence
        if: ${{ inputs.target_environment == 'production' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.evidence_run_id }}
        run: |
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir /tmp/promotion-evidence
      - name: Verify production promotion evidence
        if: ${{ inputs.target_environment == 'production' }}
        env:
          COMMIT: ${{ inputs.commit }}
          DIGEST: ${{ inputs.image_digest }}
          PERCENT: ${{ inputs.promotion_percent }}
        run: |
          evidence=$(find /tmp/promotion-evidence -name rollout-evidence.json -print -quit)
          gate=$(find /tmp/promotion-evidence -name rollout-gate.json -print -quit)
          test -n "$evidence"
          test -n "$gate"
          source_environment=staging
          minimum_age=0
          if [ "$PERCENT" = 10 ]; then source_environment=production; minimum_age=48; fi
          python3 scripts/verify_image_promotion.py --evidence "$evidence" --rollout-gate "$gate" \
            --commit "$COMMIT" --image-digest "$DIGEST" --environment "$source_environment" \
            --minimum-age-hours "$minimum_age"
      - name: Update Render provenance and rollout configuration
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT: ${{ inputs.commit }}
          DIGEST: ${{ inputs.image_digest }}
          CONFIG_VERSION: ${{ inputs.runtime_config_version }}
          TARGET: ${{ inputs.target_environment }}
          PERCENT: ${{ inputs.promotion_percent }}
        run: |
          test -n "$RENDER_API_TOKEN"
          test -n "$RENDER_SERVICE_ID"
          [[ "$CONFIG_VERSION" =~ ^[A-Za-z0-9._-]{1,120}$ ]]
          update_env() {
            curl --fail --silent --show-error --request PUT \
              --header "Authorization: Bearer $RENDER_API_TOKEN" --header "Content-Type: application/json" \
              --data "{\"value\":\"$2\"}" "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/$1" >/dev/null
          }
          update_env EDU_AGENT_DEPLOYED_COMMIT "$COMMIT"
          update_env EDU_AGENT_IMAGE_DIGEST "$DIGEST"
          update_env EDU_AGENT_RUNTIME_V2_CONFIG_VERSION "$CONFIG_VERSION"
          update_env EDU_AGENT_ENVIRONMENT "$TARGET"
          update_env EDU_AGENT_RUNTIME_V2_ENABLED true
          update_env EDU_AGENT_RUNTIME_V2_KILL_SWITCH false
          bps=$((PERCENT * 100))
          update_env EDU_AGENT_RUNTIME_V2_PERCENT_BPS "$bps"
          update_env EDU_AGENT_RUNTIME_V2_HISTORY_CHARACTER_BPS "$bps"
          if [ "$TARGET" = production ]; then
            update_env EDU_AGENT_RUNTIME_V2_SHADOW_MODE false
            update_env EDU_AGENT_RUNTIME_V2_ACTIVE_ENABLED true
          else
            update_env EDU_AGENT_RUNTIME_V2_SHADOW_MODE true
            update_env EDU_AGENT_RUNTIME_V2_ACTIVE_ENABLED false
          fi

      - name: Trigger image-backed Render deploy by digest
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_BASE: ${{ vars.BACKEND_IMAGE_BASE }}
          DIGEST: ${{ inputs.image_digest }}
          CONFIG_VERSION: ${{ inputs.runtime_config_version }}
        run: |
          test -n "$DEPLOY_HOOK_URL"
          test -n "$IMAGE_BASE"
          curl --fail --silent --show-error --get --data-urlencode "imgURL=${IMAGE_BASE}@${DIGEST}" "$DEPLOY_HOOK_URL"
      - name: Verify deployed provenance and readiness
        env:
          READY_URL: ${{ inputs.ready_url }}
          COMMIT: ${{ inputs.commit }}
          DIGEST: ${{ inputs.image_digest }}
          CONFIG_VERSION: ${{ inputs.runtime_config_version }}
        run: |
          python3 scripts/verify_deployed_commit.py --ready-url "$READY_URL" --expected-commit "$COMMIT" --expected-image-digest "$DIGEST" --expected-config-version "$CONFIG_VERSION" --attempts 30 --interval-seconds 10
          python3 scripts/release_gate.py --fast --skip-frontend --ready-url "$READY_URL"
