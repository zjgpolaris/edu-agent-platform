name: Runtime Rollout Evidence

on:
  workflow_dispatch:
    inputs:
      deployed_commit:
        description: Full commit SHA currently deployed to the target environment
        required: true
        type: string
      agent_type:
        description: Runtime agent slice
        required: true
        default: history_character
        type: string
      target_config_version:
        description: Target shadow or active config version
        required: true
        type: string
      runtime_mode:
        description: Target Runtime mode
        required: true
        default: shadow
        type: choice
        options:
          - shadow
          - active
      baseline_config_version:
        description: Trusted control config version
        required: true
        type: string
      baseline_commit:
        description: Full commit SHA that produced the control baseline
        required: true
        type: string
      target_environment:
        description: Evidence environment
        required: true
        default: production
        type: string
      minimum_samples:
        description: Minimum control and target terminal samples
        required: true
        default: '100'
        type: string
      ready_url:
        description: Target backend /api/ready URL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: runtime-rollout-evidence-${{ inputs.target_environment }}-${{ inputs.agent_type }}
  cancel-in-progress: false

jobs:
  build-and-persist-evidence:
    name: Build and persist Runtime evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployed_commit }}

      - name: Refuse revision mismatch
        env:
          EXPECTED_COMMIT: ${{ inputs.deployed_commit }}
          BASELINE_COMMIT: ${{ inputs.baseline_commit }}
          MINIMUM_SAMPLES: ${{ inputs.minimum_samples }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASELINE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MINIMUM_SAMPLES" =~ ^[0-9]+$ ]]
          test "$MINIMUM_SAMPLES" -ge 100
          test "$TARGET_ENVIRONMENT" = "production"
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt
            eval/requirements-eval.txt

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --constraint constraints-runtime.txt --requirement backend/requirements.txt

      - name: Verify deployed commit
        env:
          READY_URL: ${{ inputs.ready_url }}
        run: python3 scripts/verify_deployed_commit.py --ready-url "$READY_URL" --expected-commit "$GITHUB_SHA"

      - name: Run complete offline profile
        env:
          PYTHONPATH: backend
        run: |
          python3 eval/run_core_evals.py --profile offline --require-clean-revision --json
          mkdir -p /tmp/runtime-evidence
          cp eval/reports/latest.json /tmp/runtime-evidence/offline.json
          cp eval/reports/latest.md /tmp/runtime-evidence/offline.md

      - name: Run real LLM profile
        env:
          BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
          LLM_PROVIDER: bailian
          PYTHONPATH: backend
        run: |
          test -n "$BAILIAN_API_KEY"
          python3 eval/run_core_evals.py --profile real_llm --require-real-llm --require-clean-revision --json
          cp eval/reports/latest.json /tmp/runtime-evidence/real-llm.json
          cp eval/reports/latest.md /tmp/runtime-evidence/real-llm.md

      - name: Run production RAG profile
        env:
          READY_URL: ${{ inputs.ready_url }}
          API_BASE: ${{ secrets.API_BASE }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          PRODUCTION_SMOKE_STRICT: '1'
          PYTHONPATH: backend
        run: |
          export API_BASE="${API_BASE:-${READY_URL%/api/ready}}"
          python3 eval/run_core_evals.py --suite production_rag_health_smoke --profile production_canary --require-clean-revision --json
          cp eval/reports/latest.json /tmp/runtime-evidence/production-rag.json
          cp eval/reports/latest.md /tmp/runtime-evidence/production-rag.md

      - name: Build and persist hash-bound evidence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AGENT_TYPE: ${{ inputs.agent_type }}
          TARGET_CONFIG_VERSION: ${{ inputs.target_config_version }}
          RUNTIME_MODE: ${{ inputs.runtime_mode }}
          DEPLOYED_COMMIT: ${{ inputs.deployed_commit }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          BASELINE_CONFIG_VERSION: ${{ inputs.baseline_config_version }}
          BASELINE_COMMIT: ${{ inputs.baseline_commit }}
          MINIMUM_SAMPLES: ${{ inputs.minimum_samples }}
          PYTHONPATH: backend
        run: |
          test -n "$DATABASE_URL"
          python3 scripts/build_rollout_evidence.py \
            --agent-type "$AGENT_TYPE" \
            --config-version "$TARGET_CONFIG_VERSION" \
            --runtime-mode "$RUNTIME_MODE" \
            --deployed-commit "$DEPLOYED_COMMIT" \
            --environment "$TARGET_ENVIRONMENT" \
            --baseline-config-version "$BASELINE_CONFIG_VERSION" \
            --baseline-commit "$BASELINE_COMMIT" \
            --minimum-samples "$MINIMUM_SAMPLES" \
            --offline-report /tmp/runtime-evidence/offline.json \
            --real-llm-report /tmp/runtime-evidence/real-llm.json \
            --production-rag-report /tmp/runtime-evidence/production-rag.json \
            --output /tmp/runtime-evidence/rollout-evidence.json \
            --persist | tee /tmp/runtime-evidence/persist-status.json

      - name: Verify strict Runtime readiness
        env:
          READY_URL: ${{ inputs.ready_url }}
        run: python3 scripts/release_gate.py --fast --skip-frontend --ready-url "$READY_URL" --ready-require-runtime

      - name: Query per-agent rollout gate
        env:
          READY_URL: ${{ inputs.ready_url }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          AGENT_TYPE: ${{ inputs.agent_type }}
          MINIMUM_SAMPLES: ${{ inputs.minimum_samples }}
        run: |
          api_base="${READY_URL%/api/ready}"
          auth_header=()
          if [ -n "$API_TOKEN" ]; then auth_header=(-H "Authorization: Bearer $API_TOKEN"); fi
          curl --fail --silent --show-error --get "${auth_header[@]}" \
            --data-urlencode "agent_type=$AGENT_TYPE" \
            --data-urlencode "minimum_terminal_runs=$MINIMUM_SAMPLES" \
            "$api_base/api/admin/agent-runtime/rollout-readiness" \
            | tee /tmp/runtime-evidence/rollout-gate.json
          python3 scripts/validate_rollout_gate.py /tmp/runtime-evidence/rollout-gate.json

      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-rollout-evidence-${{ inputs.agent_type }}-${{ inputs.deployed_commit }}
          path: |
            /tmp/runtime-evidence/offline.json
            /tmp/runtime-evidence/offline.md
            /tmp/runtime-evidence/real-llm.json
            /tmp/runtime-evidence/real-llm.md
            /tmp/runtime-evidence/production-rag.json
            /tmp/runtime-evidence/production-rag.md
            /tmp/runtime-evidence/rollout-evidence.json
            /tmp/runtime-evidence/persist-status.json
            /tmp/runtime-evidence/rollout-gate.json
          if-no-files-found: warn
          retention-days: 14
