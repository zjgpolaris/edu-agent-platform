name: EduAgent CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      ready_url:
        description: Deployed backend /api/ready URL for manual production readiness, e.g. https://host/api/ready
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: write

jobs:
  frontend-quality:
    name: Frontend lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Test frontend components
        run: npm run test:unit --prefix frontend

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt
            eval/requirements-eval.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --constraint constraints-runtime.txt --requirement backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run release gate
        run: npm run release:gate

  quick-eval:
    name: Quick eval report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt
            eval/requirements-eval.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --constraint constraints-runtime.txt --requirement backend/requirements.txt

      - name: Run quick eval
        env:
          PYTHONPATH: backend
        run: python3 eval/run_core_evals.py --quick --json

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-eval-report
          path: |
            eval/reports/latest.json
            eval/reports/latest.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Post eval summary to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const mdPath = 'eval/reports/latest.md';
            const body = fs.existsSync(mdPath)
              ? `<details><summary>⚡ Quick Eval Report</summary>\n\n${fs.readFileSync(mdPath, 'utf8')}\n</details>`
              : '⚠️ Quick eval did not produce a report (likely missing LLM credentials).';
            const marker = '<!-- quick-eval-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            const fullBody = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

  postgres-migration:
    name: PostgreSQL migration and Runtime schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: edu_agent
          POSTGRES_USER: edu_agent
          POSTGRES_PASSWORD: edu_agent_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edu_agent -d edu_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-runtime.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --constraint constraints-runtime.txt --requirement backend/requirements-runtime.txt

      - name: Prepare PostgreSQL revision 003
        env:
          DATABASE_URL: postgresql://edu_agent:edu_agent_ci@127.0.0.1:5432/edu_agent
        run: alembic -c backend/alembic.ini upgrade 003

      - name: Rehearse production-shaped 003 to head upgrade
        env:
          DATABASE_URL: postgresql://edu_agent:edu_agent_ci@127.0.0.1:5432/edu_agent
          PYTHONPATH: backend
        run: python3 eval/postgres_upgrade_rehearsal.py

      - name: Verify concurrent startup migration lock
        env:
          DATABASE_URL: postgresql://edu_agent:edu_agent_ci@127.0.0.1:5432/edu_agent
          PYTHONPATH: backend
        run: python3 eval/postgres_migration_lock_smoke.py

      - name: Verify PostgreSQL Runtime schema
        env:
          DATABASE_URL: postgresql://edu_agent:edu_agent_ci@127.0.0.1:5432/edu_agent
          PYTHONPATH: backend
        run: python3 eval/postgres_schema_smoke.py

  browser-e2e:
    name: Core browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt
            eval/requirements-eval.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --constraint constraints-runtime.txt --requirement backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run core browser flows
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  docker-build:
    name: Docker builds
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t eduagent-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t eduagent-frontend:ci frontend

  production-readiness:
    name: Production readiness
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.ready_url != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt
            eval/requirements-eval.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --constraint constraints-runtime.txt --requirement backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Generate production RAG evidence
        env:
          READY_URL: ${{ inputs.ready_url }}
          API_BASE: ${{ secrets.API_BASE }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          PRODUCTION_SMOKE_STRICT: '1'
          PYTHONPATH: backend
        run: |
          export API_BASE="${API_BASE:-${READY_URL%/api/ready}}"
          if python3 eval/run_core_evals.py --suite production_rag_health_smoke --profile production_canary --require-clean-revision; then
            cp eval/reports/latest.json /tmp/production-rag-aggregate.json
            cp eval/reports/latest.md /tmp/production-rag-aggregate.md
            python3 scripts/write_evidence_status.py --profile production_rag --status pass --commit "$GITHUB_SHA" --report /tmp/production-rag-aggregate.json --output /tmp/production-rag-status.json
          else
            python3 scripts/write_evidence_status.py --profile production_rag --status fail --commit "$GITHUB_SHA" --reason profile_failed --output /tmp/production-rag-status.json
            exit 1
          fi

      - name: Run production readiness gate
        env:
          READY_URL: ${{ inputs.ready_url }}
          API_BASE: ${{ secrets.API_BASE }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          export API_BASE="${API_BASE:-${READY_URL%/api/ready}}"
          npm run release:gate:prod -- --skip-frontend --ready-url "$READY_URL" --ready-require-runtime

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-rag-evidence
          path: |
            /tmp/production-rag-aggregate.json
            /tmp/production-rag-aggregate.md
            /tmp/production-rag-status.json
          if-no-files-found: error
          retention-days: 14
